 <!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>አኩኩሉ ክራሽ - የባህል ውርርድ ጨዋታ</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(180deg, #121212, #1e1e1e);
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        .main-wrapper {
            max-width: 480px;
            margin: auto;
            background: #252529;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            border: 2px solid #ffcc00; /* የባህል ወርቃማ ቢጫ */
        }
        /* የጨዋታ አኒሜሽን ስክሪን */
        .game-screen {
            position: relative;
            height: 220px;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            border-bottom: 4px solid #ff3f34;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .ethio-flag-bar {
            height: 6px;
            width: 100%;
            background: linear-gradient(to right, #4cd137 33%, #ffcc00 33% 66%, #ff3f34 66%);
            position: absolute;
            top: 0;
        }
        .multiplier {
            font-size: 4.5rem;
            font-weight: 900;
            color: #4cd137;
            text-shadow: 0 0 20px rgba(76, 209, 55, 0.6);
            transition: transform 0.1s;
        }
        .multiplier.crashed {
            color: #ff3f34;
            text-shadow: 0 0 20px rgba(255, 63, 52, 0.6);
            animation: shake 0.3s;
        }
        /* የቁጥጥር ፓነል */
        .control-panel {
            padding: 20px;
            background: #1e1e22;
        }
        .balance-box {
            font-size: 1.1rem;
            color: #ffcc00;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .bet-input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .bet-input {
            width: 120px;
            padding: 12px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 8px;
            border: 2px solid #555;
            background: #2d2d35;
            color: #fff;
            text-align: center;
        }
        .btn {
            padding: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .btn-bet { background: #ffcc00; color: #000; }
        .btn-bet:hover { background: #e6b800; }
        .btn-cashout { background: #4cd137; color: #fff; display: none; box-shadow: 0 0 15px rgba(76,209,55,0.4); }
        .btn-cashout:hover { background: #44bd32; }
        
        /* የቀጥታ ውርርድ ሰሌዳ (ማህበራዊ ስሜት ለመስጠት) */
        .live-bets-container {
            padding: 15px;
            background: #252529;
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
        }
        .live-bets-title {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 8px;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
        }
        .bet-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 4px 0;
            border-bottom: 1px solid #333;
        }
        .bet-user { color: #ffcc00; }
        .bet-status-win { color: #4cd137; }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            50% { transform: translate(-1px, 2px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- የጨዋታ አኒሜሽን ቦታ -->
    <div class="game-screen">
        <div class="ethio-flag-bar"></div>
        <div id="status" style="font-size: 0.9rem; color: #ffcc00; font-weight: bold; position: absolute; top: 15px;">አኩኩሉ ለመጫወት ውርርድ ያስገቡ!</div>
        <div class="multiplier" id="multiplier_view">1.00x</div>
    </div>

    <!-- የቁጥጥር ቦታ -->
    <div class="control-panel">
        <div class="balance-box">💰 የቴሌብር ሂሳብ፦ <span id="balance">520.00</span> ብር</div>
        
        <div id="setup_panel">
            <div class="bet-input-group">
                <button type="button" onclick="adjustBet(-10)" style="padding: 10px; background: #444; color: white; border: none; border-radius: 5px;">-10</button>
                <input type="number" id="bet_amount" class="bet-input" value="50" min="10">
                <button type="button" onclick="adjustBet(10)" style="padding: 10px; background: #444; color: white; border: none; border-radius: 5px;">+10</button>
            </div>
            <button class="btn btn-bet" id="start_btn" onclick="startGame()">ውርርድ አስይዝ (Bet)</button>
        </div>
        
        <button class="btn btn-cashout" id="cashout_btn" onclick="cashOut()">ተገኘሁ! (Cash Out)</button>
    </div>

    <!-- ማህበራዊ የቀጥታ ውርርድ ሰሌዳ -->
    <div class="live-bets-container">
        <div class="live-bets-title">👥 የቀጥታ ተጫዋቾች ውርርድ (Live Bets)</div>
        <div id="live_bets_list">
            <div class="bet-row"><span class="bet-user">ዮናስ K.</span> <span>50 ብር ያስያዘ</span> <span class="bet-status-win">1.85x በላ 🎉</span></div>
            <div class="bet-row"><span class="bet-user">ሳራ M.</span> <span>100 ብር ያስያዘ</span> <span style="color: #ff3f34;">ተበላ ❌</span></div>
            <div class="bet-row"><span class="bet-user">ከበደ T.</span> <span>20 ብር ያስያዘ</span> <span class="bet-status-win">2.40x በላ 🎉</span></div>
        </div>
    </div>
</div>

<script>
    let currentMultiplier = 1.00;
    let gameInterval;
    let isPlaying = false;
    let crashPoint = 0;
    let balance = 520.00;

    function adjustBet(val) {
        let amt = document.getElementById('bet_amount');
        let newAmt = parseInt(amt.value) + val;
        if(newAmt >= 10) amt.value = newAmt;
    }

    async function startGame() {
        let bet = parseFloat(document.getElementById('bet_amount').value);
        if (bet > balance) {
            alert("ይቅርታ፣ በቂ የቴሌብር ሂሳብ የለዎትም!");
            return;
        }
        
        document.getElementById('status').innerText = "🔄 ከአልጎሪዝም ሰርቨር ጋር እየተገናኘ ነው...";
        
        try {
            // *** እዚህ ላይ የራስዎን የሬንደር (Render) ሊንክ መተካትዎን ያረጋግጡ ***
            let response = await fetch('https://onrender.com');
            let data = await response.json();
            crashPoint = data.crash_point;
        } catch (error) {
            crashPoint = (Math.random() * 4 + 1.1).toFixed(2); 
        }
        
        balance -= bet;
        document.getElementById('balance').innerText = balance.toFixed(2);
        
        isPlaying = true;
        currentMultiplier = 1.00;
        document.getElementById('setup_panel').style.display = 'none';
        document.getElementById('cashout_btn').style.display = 'block';
        document.getElementById('status').innerText = "🏃‍♂️ መደበቅ ጀምረዋል! ፍጠኑ...";
        document.getElementById('multiplier_view').className = "multiplier";
        
        gameInterval = setInterval(() => {
            currentMultiplier += 0.02;
            document.getElementById('multiplier_view').innerText = currentMultiplier.toFixed(2) + "x";
            
            if (currentMultiplier >= crashPoint) {
                clearInterval(gameInterval);
                document.getElementById('multiplier_view').className = "multiplier crashed";
                document.getElementById('multiplier_view').innerText = "አልበላሁም! (" + crashPoint + "x)";
                resetGame("❌ አኩኩሉ አግኝቶዎታል! ተበሉ ግዴለም።");
            }
        }, 80);
    }

    function cashOut() {
        if(!isPlaying) return;
        clearInterval(gameInterval);
        let bet = parseFloat(document.getElementById('bet_amount').value);
        let winAmount = bet * currentMultiplier;
        balance += winAmount;
        document.getElementById('balance').innerText = balance.toFixed(2);
        resetGame("🎉 ተገኘሁ! " + winAmount.toFixed(2) + " ብር በሉ!");
    }

    function resetGame(msg) {
        isPlaying = false;
        document.getElementById('status').innerText = msg;
        document.getElementById('setup_panel').style.display = 'block';
        document.getElementById('cashout_btn').style.display = 'none';
        // የውርርድ ሰሌዳውን በዘፈቀደ ማደስ (Simulation)
        updateLiveBets();
    }

    function updateLiveBets() {
        const names = ["አልማዝ", "ዳዊት", "ፎዚያ", "ቤተልሔም", "ኤልያስ"];
        let html = "";
        for(let i=0; i<3; i++) {
            let rName = names[Math.floor(Math.random()*names.length)];
            let rBet = Math.floor(Math.random()*50)+10;
            let rWin = Math.random() > 0.5;
            let mult = (Math.random()*2+1.1).toFixed(2);
            html += `<div class="bet-row"><span class="bet-user">${rName}</span> <span>${rBet} ብር ያስያዘ</span> ${rWin ? `<span class="bet-status-win">\${mult}x በላ 🎉</span>` : `<span style="color: #ff3f34;">ተበላ ❌</span>`}</div>`;
        }
        document.getElementById('live_bets_list').innerHTML = html;
    }
</script>
</body>
</html>
